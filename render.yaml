databases:
  - name: bookmyservice-db
    databaseName: bookmyservice
    user: bookmyservice_user
    plan: free

services:
  - type: web
    name: bookmyservice-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyservice-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173"
      - key: PYTHON_VERSION
        value: "3.12.0"
